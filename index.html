<!DOCTYPE html>
<html lang="pl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<title>RELAX KEBAB - System Paragonów</title>
<style>

let pole=document.getElementById(id);
let ilosc=Number(pole.innerText)+zmiana;
.produkty{
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}


.produkt{
    width:220px;
    min-height:230px;
}


.produkt button{

    width:60px;
    height:60px;
    font-size:30px;
    border-radius:50%;

}


.produkt span{

    font-size:32px;
    font-weight:bold;
    min-width:50px;

}
if(ilosc<0) ilosc=0;

pole.innerText=ilosc;

policzSume();

}



function policzSume(){

let suma=0;


document.querySelectorAll(".produkt").forEach(el=>{

let ilosc=Number(el.querySelector("span").innerText);
let cena=Number(el.dataset.price);

suma+=ilosc*cena;

});


let rabat=Number(document.getElementById("rabat").value);

let przecena=suma-(suma*rabat/100);



document.getElementById("sumaKoszyka").innerHTML=

"💰 Cena: "+suma.toFixed(2)+" zł<br>"+
"🎁 Rabat: "+rabat+"%<br>"+
"✅ Do zapłaty: "+przecena.toFixed(2)+" zł";

}



function wystawParagon(){

let tekst="";
let suma=0;


document.querySelectorAll(".produkt").forEach(el=>{

let ilosc=Number(el.querySelector("span").innerText);

if(ilosc>0){

let cena=Number(el.dataset.price);

tekst+=el.dataset.name+" x"+ilosc+"<br>";

suma+=ilosc*cena;

}

});


if(tekst==""){

alert("Wybierz produkty");
return;

}



let rabat=Number(document.getElementById("rabat").value);

let poRabacie=suma-(suma*rabat/100);



document.getElementById("paragon").innerHTML=

"<div class='paragon'>"+
"<h3>🌯 RELAX KEBAB</h3>"+
tekst+
"<br>💰 Przed rabatem: "+suma.toFixed(2)+" zł"+
"<br>🎁 Rabat: "+rabat+"%"+
"<br>✅ Do zapłaty: "+poRabacie.toFixed(2)+" zł"+
"<br>📅 "+new Date().toLocaleString("pl-PL")+
"</div>";



document.querySelectorAll(".produkt span").forEach(e=>{

e.innerText="0";

});


document.getElementById("rabat").value="0";

policzSume();

}
</style>
    <script>

function zmienIlosc(id, zmiana){

    let pole = document.getElementById(id);

    let ilosc = parseInt(pole.innerText);

    ilosc += zmiana;

    if(ilosc < 0){
        ilosc = 0;
    }

    pole.innerText = ilosc;

    policzSume();
}



function policzSume(){

    let suma = 0;

    document.querySelectorAll(".produkt").forEach(function(el){

        let ilosc = Number(el.querySelector("span").innerText);
        let cena = Number(el.dataset.price);

        suma += ilosc * cena;

    });


    let rabat = Number(document.getElementById("rabat").value);

    let cenaPoRabacie = suma - (suma * rabat / 100);


    document.getElementById("sumaKoszyka").innerHTML =

    "💰 Cena: " + suma.toFixed(2) + " zł<br>" +
    "🎁 Rabat: " + rabat + "%<br>" +
    "✅ Do zapłaty: " + cenaPoRabacie.toFixed(2) + " zł";

}



function wystawParagon(){

    let produkty = "";
    let suma = 0;


    document.querySelectorAll(".produkt").forEach(function(el){

        let ilosc = Number(el.querySelector("span").innerText);

        if(ilosc > 0){

            let cena = Number(el.dataset.price);

            produkty += "🍽️ " + el.dataset.name +
            " x" + ilosc + "<br>";

            suma += cena * ilosc;
        }

    });


    if(produkty === ""){

        alert("Dodaj produkty!");
        return;

    }


    let rabat = Number(document.getElementById("rabat").value);

    let poRabacie = suma - (suma*rabat/100);



    document.getElementById("paragon").innerHTML =

    `
    <div class="paragon">

    <h3>🌯 RELAX KEBAB</h3>

    ${produkty}

    <hr>

    💰 Przed rabatem:
    ${suma.toFixed(2)} zł

    <br>

    🎁 Rabat:
    ${rabat}%

    <br>

    ✅ Do zapłaty:
    ${poRabacie.toFixed(2)} zł

    <br><br>

    📅 ${new Date().toLocaleString("pl-PL")}

    </div>
    `;



    document.querySelectorAll(".produkt span").forEach(function(e){

        e.innerText="0";

    });


    document.getElementById("rabat").value="0";

    policzSume();

}


</script>
</head>
<body>

<div class="topbar">
    <h1>🌯 RELAX KEBAB</h1>
    <p>Tuchomie • ul. Mickiewicza 1</p>
</div>

<div class="box">

<h2>🧾 Zamówienie</h2>

<div class="menu">

<div class="produkty">

<div class="produkt" data-name="Duży Kebab Rollo" data-price="35">
🌯<br><b>Duży Kebab Rollo</b><br>35 zł<br><br>
<button onclick="zmienIlosc('duzy_rollo',-1)">➖</button>
<span id="duzy_rollo">0</span>
<button onclick="zmienIlosc('duzy_rollo',1)">➕</button>
</div>

<div class="produkt" data-name="Mały Kebab Rollo" data-price="28">
🌯<br><b>Mały Kebab Rollo</b><br>28 zł<br><br>
<button onclick="zmienIlosc('maly_rollo',-1)">➖</button>
<span id="maly_rollo">0</span>
<button onclick="zmienIlosc('maly_rollo',1)">➕</button>
</div>

<div class="produkt" data-name="Mały Kebab" data-price="28">
🥙<br><b>Mały Kebab</b><br>28 zł<br><br>
<button onclick="zmienIlosc('maly_kebab',-1)">➖</button>
<span id="maly_kebab">0</span>
<button onclick="zmienIlosc('maly_kebab',1)">➕</button>
</div>

<div class="produkt" data-name="Kebab z frytkami" data-price="36">
🍱<br><b>Kebab z frytkami</b><br>36 zł<br><br>
<button onclick="zmienIlosc('talerz',-1)">➖</button>
<span id="talerz">0</span>
<button onclick="zmienIlosc('talerz',1)">➕</button>
</div>

<div class="produkt" data-name="Frytki" data-price="15">
🍟<br><b>Frytki</b><br>15 zł<br><br>
<button onclick="zmienIlosc('frytki',-1)">➖</button>
<span id="frytki">0</span>
<button onclick="zmienIlosc('frytki',1)">➕</button>
</div>

<div class="produkt" data-name="Ayran" data-price="13">
🥤<br><b>Ayran</b><br>13 zł<br><br>
<button onclick="zmienIlosc('ayran',-1)">➖</button>
<span id="ayran">0</span>
<button onclick="zmienIlosc('ayran',1)">➕</button>
</div>

</div>


<label><b>🎁 Rabat:</b></label><br>

<select id="rabat" onchange="policzSume()">
<option value="0">Brak rabatu</option>
<option value="20">🚒 PSP (-20%)</option>
<option value="10">🚑 KPP / PR / SD (-10%)</option>
</select>


<h2 id="sumaKoszyka">
💰 Razem: 0 zł
</h2>


<button class="wystaw" onclick="wystawParagon()">
🧾 Wyślij paragon
</button>


<div id="paragon"></div>


</div>
</div>
</script>    
</body>
</html>
